# Hosting temporal mientras la cuenta de Vercel está en pausa (hasta 2026-12-05).
# Vercel sigue siendo el hosting principal: ver SISTEMA/VOLVER-A-VERCEL.md.
# Usar un workspace de Render distinto al de Delivery.
# Los valores se cargan a mano en Render; aquí no va ningún secreto.
services:
  - type: web
    name: kaxa-panel-temporal
    runtime: node
    plan: free
    region: virginia
    branch: hosting-temporal
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: KAXA_DIRECTORIO_URL
        sync: false
      - key: KAXA_DIRECTORIO_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
